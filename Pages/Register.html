 <!-- Add basic Auth and then database. SQL. -->
  <!-- Prevent forms from reloading the page-->
   <!--Change the styling on the Login/Signup Page switch-->


<section id="auth-page">
    
<div class="auth-container">
<div id="Signup-form" class="auth-form active">
    <h2>Create Your Account</h2>

    <form action="/register" method="POST">
        <!--Add name Attributes to form-->
        <label for="signup-username"></label>
        <input type="text" id="signup-username" name="username" autocomplete="off" placeholder="Username">

        <label for="signup-email"></label>
        <input type="text" id="signup-email" name="email" autocomplete="off" placeholder="Email">

        <div class="toggle-icon">

            <label for="signup-password"></label>
            <input type="password" id="signup-password" name="password" autocomplete="off" placeholder="Password">
            <button type="button" id="toggle-signup-password">Show</button>
        </div>
       
        <div class="toggle-icon">

            <label for="signup-confirm-pswd"></label>
            <input type="password" id="signup-confirm-pswd" name="confirmPassword" autocomplete="off" placeholder="Confirm Password">
            <button type="button" id="toggle-signup-confirm-pswd"> Show</button>
        </div>

        <div class="form-buttons">

        <button type="submit" class="submit-btn">
            Sign Up
        </button>

        <button type="button" class="submit-btn" id="show-login">
            Login
        </button>


        </div>
    </form>
</div>

<div id="Login-form" class="auth-form">
    <h2>Login</h2>
<!-- You know having Login and login may cause issues right? -->
 <!--Add name attributes to form-->
    <form id="login-form">
        <label for="login-username"></label>
        <input type="text" id="login-username" autocomplete="off" placeholder="Username">

        <label for="login-password"></label>
        <input type="password" id="login-password" autocomplete="off" placeholder="Password">

        <div class="form-buttons">
            <button type="submit" class="submit-btn">
                Login
            </button>

            <button type="button" class="submit-btn" id="show-signup">
                Sign Up
            </button>
        </div>
    </form>
</div>
